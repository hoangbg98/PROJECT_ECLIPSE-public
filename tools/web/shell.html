<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>PROJECT ECLIPSE</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #12162a; overflow: hidden; color: #c8d0e0; font-family: system-ui, sans-serif; }
#canvas { display: block; width: 100%; height: 100%; outline: none; }
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #12162a; z-index: 5; }
#loading h1 { margin: 0; font-size: 28px; letter-spacing: 4px; }
#bar { width: min(420px, 70vw); height: 10px; border-radius: 5px; background: #262b45; overflow: hidden; }
#bar > div { width: 0%; height: 100%; background: #6f8cff; transition: width .15s; }
#note { font-size: 14px; opacity: .8; text-align: center; padding: 0 16px; }
#note.err { color: #ff8a80; }
/* Nút Google: nút thật của Google phủ lên canvas (trình duyệt chỉ mở cửa sổ đăng nhập khi bấm vào nút này). */
#google-slot { position: fixed; left: 50%; top: 62%; transform: translate(-50%, -50%); z-index: 4; display: none; }
</style>
</head>
<body>
<canvas id="canvas">Trình duyệt không hỗ trợ WebGL / canvas.</canvas>
<div id="loading"><h1>PROJECT ECLIPSE</h1><div id="bar"><div></div></div><div id="note">Đang tải game…</div></div>
<div id="google-slot"></div>
$GODOT_HEAD_INCLUDE
<script src="$GODOT_URL"></script>
<script>
// ---- Cầu nối đăng nhập Google (GDScript: scripts/online/google_signin.gd) ----
window.eclipseGoogle = (function () {
  let scriptPromise = null;
  function loadGsi() {
    if (window.google && window.google.accounts && window.google.accounts.id) return Promise.resolve();
    if (!scriptPromise) {
      scriptPromise = new Promise(function (resolve, reject) {
        const s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.onload = resolve;
        s.onerror = function () { scriptPromise = null; reject(new Error('Không tải được thư viện đăng nhập Google')); };
        document.head.appendChild(s);
      });
    }
    return scriptPromise;
  }
  return {
    show: function (clientId, onCredential, onError) {
      loadGsi().then(function () {
        google.accounts.id.initialize({
          client_id: clientId,
          callback: function (resp) { if (resp && resp.credential) onCredential(resp.credential); },
          ux_mode: 'popup',
          auto_select: false,
        });
        const slot = document.getElementById('google-slot');
        slot.innerHTML = '';
        google.accounts.id.renderButton(slot, { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', width: 320, locale: 'vi' });
        slot.style.display = 'block';
      }).catch(function (e) { onError(String(e && e.message || e)); });
    },
    hide: function () { document.getElementById('google-slot').style.display = 'none'; },
  };
})();

// ---- Khởi động engine ----
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
const note = document.getElementById('note');
const barFill = document.querySelector('#bar > div');
(function () {
  const missing = Engine.getMissingFeatures({ threads: GODOT_CONFIG.threads || false });
  if (missing.length) {
    note.className = 'err';
    note.textContent = 'Trình duyệt thiếu tính năng cần thiết: ' + missing.join(', ') + '. Hãy dùng Chrome / Edge / Firefox bản mới.';
    return;
  }
  engine.startGame({
    onProgress: function (current, total) {
      if (total > 0) {
        barFill.style.width = Math.min(100, (current / total) * 100).toFixed(1) + '%';
        note.textContent = 'Đang tải game… ' + (current / 1048576).toFixed(0) + ' / ' + (total / 1048576).toFixed(0) + ' MB (lần đầu mới lâu)';
      } else {
        note.textContent = 'Đang tải game… ' + (current / 1048576).toFixed(0) + ' MB';
      }
    },
  }).then(function () {
    document.getElementById('loading').style.display = 'none';
  }, function (err) {
    note.className = 'err';
    note.textContent = 'Lỗi khởi động: ' + err.message;
  });
})();
</script>
</body>
</html>
